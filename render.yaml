services:
  # NOTE: this is a "web" (public) service, not "pserv" (private),
  # because Render's free plan doesn't support private services.
  # It has no built-in authentication — accepted tradeoff for a demo
  # deployment, see README for details.
  - type: web
    name: recallai-engine
    runtime: docker
    plan: free
    dockerfilePath: ./vector-engine/Dockerfile
    dockerContext: ./vector-engine

  - type: web
    name: recallai-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    envVars:
      # fromService hostport (Render's private-networking hostname)
      # did not turn out to be reachable between two free-tier "web"
      # services in practice, so this points at the engine's public
      # HTTPS URL directly instead — already-accepted tradeoff, see
      # the note on recallai-engine above.
      - key: VECTOR_ENGINE_URL
        value: https://recallai-engine.onrender.com
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
